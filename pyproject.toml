[project]
name = "context-signal-lab"
version = "0.1.0"
description = "Local-first regression and risk analysis for LLM conversation traces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
context-signal = "context_signal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_signal"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
